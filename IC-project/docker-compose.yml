services:
  db:
    image: postgres:16-alpine
    container_name: ic-tender-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ic_tender}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-ic_tender}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ic_tender_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ic_tender} -d ${POSTGRES_DB:-ic_tender}"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  ic_tender_pgdata:
